apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudobjectiq-ml-deploy
  labels:
    app: cloudobjectiq-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudobjectiq-ml
  template:
    metadata:
      labels:
        app: cloudobjectiq-ml
    spec:
      containers:
      - name: ml-service
        image: ciqacr4781.azurecr.io/cloudobjectiq-ml:v1
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "3Gi"
        env:
        - name: ML_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudobjectiq-secrets
              key: ml-service-api-key
              optional: true
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloudobjectiq-secrets
              key: database-url
              optional: true
        livenessProbe:
          httpGet:
            path: /api/ml/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/ml/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudobjectiq-ml-service
  labels:
    app: cloudobjectiq-ml
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: cloudobjectiq-ml
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudobjectiq-ml-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudobjectiq-ml-deploy
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

