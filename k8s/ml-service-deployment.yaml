apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudobjectiq-ml-deploy
  labels:
    app: cloudobjectiq-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudobjectiq-ml
  template:
    metadata:
      labels:
        app: cloudobjectiq-ml
    spec:
      containers:
      - name: ml-service
        image: ciqacr4781.azurecr.io/cloudobjectiq-ml:v2
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "6Gi"
        env:
        - name: ML_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudobjectiq-secrets
              key: ml-service-api-key
              optional: true
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloudobjectiq-secrets
              key: database-url
              optional: true
        - name: HF_HOME
          value: "/app/cache/huggingface"
        - name: TORCH_HOME
          value: "/app/cache/torch"
        - name: OPENSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: cloudobjectiq-config
              key: opensearch-url
              optional: true
        - name: MILVUS_URI
          valueFrom:
            configMapKeyRef:
              name: cloudobjectiq-config
              key: milvus-uri
              optional: true
        volumeMounts:
        - name: model-cache-volume
          mountPath: /app/cache
        livenessProbe:
          httpGet:
            path: /api/ml/health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/ml/document/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: model-cache-volume
        emptyDir:
          sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudobjectiq-ml-service
  labels:
    app: cloudobjectiq-ml
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: cloudobjectiq-ml
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudobjectiq-ml-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudobjectiq-ml-deploy
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
