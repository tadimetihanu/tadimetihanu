services:
  - type: web
    name: cloudobjectiq-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3001"
      - key: APP_URL
        value: https://app.cloudobjectiq.com
      - key: RENDER_POSTGRES_ID
        value: dpg-dbk8g0etlv9c73f5kitg-a
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: WHEN_REQUIRED
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: WHEN_REQUIRED
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=160 --max-semi-space-size=4 --expose-gc"
      - key: JAVA_HOME
        value: "/usr/lib/jvm/java-17-openjdk-amd64"
      - key: SPARK_LOCAL_IP
        value: "127.0.0.1"
      - key: SPARK_SUBMIT_OPTS
        value: "-Dspark.testing.memory=471859200"
      - key: PYSPARK_PYTHON
        value: "/usr/bin/python3"
      - key: PYSPARK_DRIVER_PYTHON
        value: "/usr/bin/python3"
      - key: PYSPARK_SUBMIT_ARGS
        value: "--conf spark.testing.memory=471859200 --driver-memory 200m --executor-memory 512m pyspark-shell"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
