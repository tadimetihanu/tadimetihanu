# CloudObjectIQ - Apache Doris Local Development & Testing Stack
# Runs isolated single-node Doris FE + BE alongside CloudObjectIQ
services:
  doris-fe:
    image: apache/doris:fe-2.1.7
    container_name: cloudobjectiq-doris-fe
    hostname: doris-fe
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - FE_ID=1
    ports:
      - "127.0.0.1:9030:9030" # MySQL query port (restricted to localhost)
      - "127.0.0.1:8030:8030" # FE Web / REST API
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris-net:
        ipv4_address: 172.20.80.2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8030/api/bootstrap || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  doris-be:
    image: apache/doris:be-2.1.7
    container_name: cloudobjectiq-doris-be
    hostname: doris-be
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - BE_ADDR=172.20.80.3:9050
    ports:
      - "127.0.0.1:8040:8040" # BE Web / REST API
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 172.20.80.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.80.0/24
