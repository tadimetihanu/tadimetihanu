# d:/CloudObjectIQ_Ready/docker-compose.minio.yml
# MinIO service for the CloudObjectIQ_Ready project
# UI on port 9001, S3 API on port 9000 (same as before).

services:
  minio:
    image: minio/minio:latest
    container_name: minio-coiq
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_PORT: "9001"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
    driver: local
