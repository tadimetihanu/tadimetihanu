<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milvus Vector Explorer | CloudObjectIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --accent: #f39c12;
            --bg-deep: #0f0f0f;
            --bg-card: #1a1a1a;
            --text-main: #e0e0e0;
            --text-dim: #999;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .title-group h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #f39c12, #ffcc33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-section {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .search-controls {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: #252525;
            border: 1px solid #444;
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-search {
            background: var(--accent);
            color: black;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-search:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .filter-tags {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 15px;
            background: #333;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .tag.active {
            background: rgba(243, 156, 18, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #333;
            position: relative;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .result-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }

        .score-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,255,100,0.1);
            color: #00ff66;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-meta {
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #ccc;
            white-space: pre-wrap;
            max-height: 100px;
            overflow-y: auto;
        }

        .loading-shimmer {
            text-align: center;
            padding: 50px;
            color: var(--text-dim);
            font-style: italic;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div class="title-group">
                <h1>Vector Explorer</h1>
                <p style="color: var(--text-dim)">Native BM25 Search Engine for Milvus DB</p>
            </div>
            <a href="index.html" class="btn-search" style="text-decoration:none; padding:12px 20px; display:inline-block; font-size:0.9rem">Back to Data Lake</a>
        </div>

        <div class="search-section">
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Enter keywords (e.g. 'Azure Kubernetes', 'Ranking API')...">
                <button class="btn-search" id="searchBtn">RANK RESULTS</button>
            </div>
            <div class="filter-tags" id="tagsList">
                <div class="tag active" data-val="All">All Categories</div>
                <div class="tag" data-val="Cloud-Infra">Cloud-Infra</div>
                <div class="tag" data-val="Product">Product</div>
                <div class="tag" data-val="Programming">Programming</div>
                <div class="tag" data-val="General">General</div>
            </div>
        </div>

        <div class="results-grid" id="resultsGrid">
            <!-- Dynamic Content -->
            <div class="empty-state">Enter a query above to start exploring the vector space.</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const tagsList = document.getElementById('tagsList');
        
        let activeCategory = 'All';

        // Handle Tags
        tagsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('tag')) {
                document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                activeCategory = e.target.dataset.val;
                if (searchInput.value) performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value;
            if (!query) return;

            resultsGrid.innerHTML = '<div class="loading-shimmer">📡 Connecting to Milvus standalone... (Applying BM25 Ranking)</div>';

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/milvus/search', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ query, category: activeCategory })
                });

                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    renderResults(data.results);
                } else {
                    resultsGrid.innerHTML = '<div class="empty-state">No matching records found for this query.</div>';
                }
            } catch (err) {
                resultsGrid.innerHTML = `<div class="empty-state" style="color:red">Failed to search: ${err.message}</div>`;
            }
        }

        function renderResults(hits) {
            resultsGrid.innerHTML = '';
            hits.forEach(hit => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="score-badge">Relevance: ${hit.score}</div>
                    <div class="card-category">${hit.category || 'Uncategorized'}</div>
                    <div class="card-text">${hit.text}</div>
                    <div class="card-meta">${JSON.stringify(hit.metadata, null, 2)}</div>
                `;
                resultsGrid.appendChild(card);
            });
        }

        searchBtn.onclick = performSearch;
        searchInput.onkeypress = (e) => { if(e.key === 'Enter') performSearch(); };
    </script>
</body>
</html>
